name: oj-infra

# 中间件栈：MySQL 8 / Redis 7 / RabbitMQ 3.13
# 所有端口只绑定 127.0.0.1，外网无法直连；本地开发通过 SSH 隧道访问：
#   ssh -N -L 3306:127.0.0.1:3306 -L 6379:127.0.0.1:6379 \
#          -L 5672:127.0.0.1:5672 -L 15672:127.0.0.1:15672 root@47.243.5.119

services:
  mysql:
    image: mysql:8.0
    container_name: oj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M   # 3.4G 内存的机器，别用默认值
      - --innodb-log-file-size=64M
      - --max-connections=100
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [oj-net]

  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [oj-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: oj-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"     # 管理台：隧道后访问 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks: [oj-net]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  oj-net:
    driver: bridge
